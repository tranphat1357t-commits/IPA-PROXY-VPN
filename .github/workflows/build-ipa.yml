name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod install --repo-update

      - name: Check schemes
        run: |
          xcodebuild -list \
            -workspace iShadowsocksR.xcworkspace

      - name: Build archive
        run: |
          xcodebuild archive \
            -workspace iShadowsocksR.xcworkspace \
            -scheme iShadowsocksR \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/iShadowsocksR.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Create IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$RUNNER_TEMP/iShadowsocksR.xcarchive/Products/Applications/"*.app \
            "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          zip -r iShadowsocksR-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iShadowsocksR-IPA
          path: ${{ runner.temp }}/iShadowsocksR-unsigned.ipa
          if-no-files-found: error
