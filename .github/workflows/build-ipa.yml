name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    # The project is Swift 4 / Xcode 14-era code. Xcode 16 on macos-15
    # fails while compiling the legacy PacketProcessor sources.
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v5

      - name: Select compatible Xcode
        run: |
          set -e

          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcode-select -p
          xcodebuild -version

      - name: Clone source with submodules
        run: |
          set -e

          git clone \
            --depth 1 \
            --recurse-submodules \
            https://github.com/ShadowsocksR-Live/iShadowsocksR.git \
            source

          cd source
          git submodule update --init --recursive

      - name: Verify source and submodules
        working-directory: source
        run: |
          set -e

          echo "Submodule status:"
          git submodule status

          test -d Library/QRScanner
          test -d Library/CallbackURLKit
          test -d Library/CocoaAsyncSocket
          test -d Library/CocoaLumberjack
          test -d Library/Eureka
          test -d Library/KissXML
          test -d Library/MMWormhole
          test -d Library/libmaxminddb
          test -d Library/ssrNative
          test -d Library/yaml

          test -f overtls/build-apple.sh
          test -f iShadowsocksR.xcworkspace/contents.xcworkspacedata

      - name: Install Rust
        run: |
          set -e

          rustup toolchain install stable
          rustup default stable

          rustup target add \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios \
            aarch64-apple-darwin \
            x86_64-apple-darwin

          cargo install cbindgen

      - name: Build overTLS
        working-directory: source/overtls
        run: |
          set -e

          chmod +x build-apple.sh
          ./build-apple.sh

      - name: Verify overTLS framework
        run: |
          set -e

          test -d source/overtls/overtls.xcframework
          test -f source/overtls/overtls.xcframework/Info.plist

          echo "overTLS framework created successfully:"
          find source/overtls/overtls.xcframework -maxdepth 2 -type f | head -30

      - name: Install CocoaPods
        run: |
          set -e

          sudo gem install cocoapods -v 1.12.1
          pod --version

      - name: Install Pods
        working-directory: source
        run: |
          set -e

          # Xcode 15+ no longer ships libarclite for the old deployment
          # targets used by the legacy local libraries.
          # Use CocoaPods CDN instead of cloning the deprecated multi-GB
          # Specs.git repository.
          sed -i '' \
            "s#source 'https://github.com/CocoaPods/Specs.git'#source 'https://cdn.cocoapods.org/'#" \
            Podfile
          COCOAPODS_DISABLE_STATS=true pod install --no-repo-update

      - name: Patch PSOperations for Swift concurrency
        working-directory: source
        run: |
          set -e

          ps_file="Pods/PSOperations/PSOperations/Operation.swift"
          test -f "$ps_file"

          # Xcode 15.4 annotates Foundation.Operation completionBlock as
          # @Sendable; PSOperations 5.0.0 still uses the pre-Swift 6 type.
          sed -i '' \
            's/override open var completionBlock: (() -> Void)?/override open var completionBlock: (@Sendable () -> Void)?/' \
            "$ps_file"

          grep -n "completionBlock" "$ps_file"

      - name: Normalize deployment targets
        working-directory: source
        run: |
          set -e

          while IFS= read -r -d '' project_file; do
            sed -i '' -E \
              's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g' \
              "$project_file"
          done < <(find . -name project.pbxproj -print0)

      - name: List available schemes
        working-directory: source
        run: |
          set -e

          xcodebuild \
            -workspace iShadowsocksR.xcworkspace \
            -list

      - name: Build archive
        working-directory: source
        run: |
          set -e
          set -o pipefail

          if ! xcodebuild archive \
            -workspace iShadowsocksR.xcworkspace \
            -scheme iShadowsocksR \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iShadowsocksR.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"; then
            echo "Build diagnostics:"
            grep -n -E \
              'error:|fatal error:|clang: error|SwiftCompile|Ld |CodeSign|PhaseScriptExecution' \
              "$RUNNER_TEMP/xcodebuild.log" || true
            exit 65
          fi

      - name: Verify archive
        run: |
          set -e

          test -d "$RUNNER_TEMP/iShadowsocksR.xcarchive"
          test -d "$RUNNER_TEMP/iShadowsocksR.xcarchive/Products/Applications"

          find \
            "$RUNNER_TEMP/iShadowsocksR.xcarchive/Products/Applications" \
            -maxdepth 1 \
            -name "*.app" \
            -print

      - name: Create unsigned IPA
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R \
            "$RUNNER_TEMP/iShadowsocksR.xcarchive/Products/Applications/"*.app \
            "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          rm -f iShadowsocksR-unsigned.ipa
          zip -r iShadowsocksR-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iShadowsocksR-unsigned-IPA
          path: ${{ runner.temp }}/iShadowsocksR-unsigned.ipa
          if-no-files-found: error
